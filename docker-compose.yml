services:
  immich-public-proxy:
    image: ghcr.io/christopheraparicio/immich-public-proxy:3.2.1-immich-share.2
    container_name: immich-public-proxy
    init: true
    restart: unless-stopped
    ports:
      # Bind to loopback; publish through a TLS reverse proxy.
      - "127.0.0.1:3000:3000"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      IMMICH_URL: ${IMMICH_URL:?set IMMICH_URL in .env}
      TMPDIR: /zip-staging
    volumes:
      - zip-staging:/zip-staging
      # Copy app/config.json, edit it locally, then uncomment if needed:
      # - ./config.json:/app/config.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zip-staging:
