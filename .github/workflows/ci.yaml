name: CI

on:
  workflow_dispatch:
  push:
    branches: [immich-share, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            docs/package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts
        working-directory: app

      - name: Compile server and client
        run: npm run build
        working-directory: app

      - name: Run regression suite
        run: npm test
        working-directory: app

      - name: Audit application dependencies
        run: npm audit --audit-level=moderate
        working-directory: app

      - name: Install locked documentation dependencies
        run: npm ci --include=dev --ignore-scripts
        working-directory: docs

      - name: Audit documentation dependencies
        run: npm audit --audit-level=moderate
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - name: Validate Compose
        run: docker compose config --quiet
        env:
          PUBLIC_BASE_URL: https://photos.example.com
          IMMICH_URL: http://192.0.2.10:2283

      - name: Build production image
        run: |
          docker build \
            --build-arg PACKAGE_VERSION=$(node -p "require('./app/package.json').version") \
            --build-arg VCS_REF=${GITHUB_SHA} \
            --tag immich-public-proxy:test .

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: immich-public-proxy:test
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln
